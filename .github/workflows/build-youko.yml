name: Build Youko Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: youko-build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/youko-nobody/subboost-youko

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(node -p "require('./package.json').version")"
          short_sha="${GITHUB_SHA::12}"
          build_version="${release_version}+sha.${short_sha}"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "build_version=${build_version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: local/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_RELEASE_VERSION=${{ steps.meta.outputs.release_version }}
            APP_BUILD_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.meta.outputs.build_version }}
            APP_VERSION_TOKEN=${{ steps.meta.outputs.build_version }}
          cache-from: type=gha,scope=youko-amd64
          cache-to: type=gha,mode=max,scope=youko-amd64
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.release_version }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.short_sha }}
